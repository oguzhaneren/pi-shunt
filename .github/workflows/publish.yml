name: publish

# Publish to npm whenever a version tag (v*) is pushed.
# The tag MUST match package.json version - CI verifies this and fails otherwise.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Do NOT set registry-url: it writes an .npmrc with a placeholder
          # NODE_AUTH_TOKEN, and npm prefers that over OIDC, breaking
          # trusted publishing (npm/cli#8730).

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            echo "Use 'npm version patch|minor|major' to bump + tag in one step."
            exit 1
          fi
          echo "Tag v$TAG matches package.json version $PKG"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
